<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MMO 3D Navigateur</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #10121a;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        color: #e6e6e6;
        font: 13px/1.4 -apple-system, system-ui, sans-serif;
        background: rgba(0, 0, 0, 0.35);
        padding: 8px 12px;
        border-radius: 6px;
        pointer-events: none;
      }
      #hotbar {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        pointer-events: none;
      }
      .spell-slot {
        position: relative;
        width: 60px;
        height: 60px;
        border: 2px solid #4a5578;
        border-radius: 8px;
        background: rgba(20, 22, 32, 0.7);
        color: #e6e6e6;
        font: 12px/1.3 -apple-system, system-ui, sans-serif;
        overflow: hidden;
      }
      .spell-slot .key {
        position: absolute;
        top: 3px;
        left: 5px;
        font-weight: 600;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
      .spell-slot .name {
        position: absolute;
        bottom: 3px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 10px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
      .spell-slot .cooldown {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 0%;
        background: rgba(0, 0, 0, 0.65);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">Connecting…</div>
    <div id="hotbar">
      <div class="spell-slot" data-spell="1">
        <span class="key">1</span>
        <div class="cooldown" data-cooldown="1"></div>
        <span class="name" data-name="1"></span>
      </div>
      <div class="spell-slot" data-spell="2">
        <span class="key">2</span>
        <div class="cooldown" data-cooldown="2"></div>
        <span class="name" data-name="2"></span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
