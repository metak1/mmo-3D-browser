<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MMO 3D Navigateur</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #10121a;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      .overlay-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: rgba(8, 9, 14, 0.92);
        color: #e6e6e6;
        font: 14px/1.4 -apple-system, system-ui, sans-serif;
        z-index: 10;
      }
      .overlay-screen[hidden] {
        display: none;
      }
      .overlay-screen h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
      }
      .overlay-error {
        color: #e0503c;
        font-size: 12px;
        min-height: 14px;
      }
      #class-select-options {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 720px;
      }
      .class-card {
        width: 130px;
        padding: 16px 12px;
        border: 2px solid #4a5578;
        border-radius: 10px;
        background: rgba(20, 22, 32, 0.85);
        color: #e6e6e6;
        font: inherit;
        cursor: pointer;
        text-align: center;
      }
      .class-card:hover,
      .class-card.selected {
        border-color: #c9a63c;
        background: rgba(40, 36, 20, 0.85);
      }
      .class-card .class-name {
        font-weight: 600;
        margin-bottom: 6px;
      }
      .class-card .class-stat {
        font-size: 11px;
        color: #a7b0c8;
      }
      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 260px;
      }
      .auth-form input,
      .overlay-input {
        padding: 8px 10px;
        border: 2px solid #4a5578;
        border-radius: 6px;
        background: rgba(20, 22, 32, 0.85);
        color: #e6e6e6;
        font: inherit;
      }
      .auth-form input:focus,
      .overlay-input:focus {
        outline: none;
        border-color: #c9a63c;
      }
      .overlay-button {
        padding: 9px 10px;
        border: 2px solid #4a5578;
        border-radius: 6px;
        background: rgba(20, 22, 32, 0.85);
        color: #e6e6e6;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .overlay-button:hover {
        border-color: #c9a63c;
        background: rgba(40, 36, 20, 0.85);
      }
      .overlay-link {
        background: none;
        border: none;
        color: #a7b0c8;
        font: inherit;
        text-decoration: underline;
        cursor: pointer;
        padding: 0;
      }
      #character-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 320px;
      }
      .character-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 14px;
        border: 2px solid #4a5578;
        border-radius: 8px;
        background: rgba(20, 22, 32, 0.85);
        cursor: pointer;
        text-align: left;
        color: #e6e6e6;
        font: inherit;
      }
      .character-row:hover {
        border-color: #c9a63c;
        background: rgba(40, 36, 20, 0.85);
      }
      .character-row .character-name {
        font-weight: 600;
      }
      .character-row .character-meta {
        font-size: 11px;
        color: #a7b0c8;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        color: #e6e6e6;
        font: 13px/1.4 -apple-system, system-ui, sans-serif;
        background: rgba(0, 0, 0, 0.35);
        padding: 8px 12px;
        border-radius: 6px;
        pointer-events: none;
      }
      .unit-panel {
        position: fixed;
        left: 12px;
        width: 220px;
        color: #e6e6e6;
        font: 12px/1.3 -apple-system, system-ui, sans-serif;
        background: rgba(20, 22, 32, 0.7);
        border: 2px solid #4a5578;
        border-radius: 8px;
        padding: 8px 10px;
        cursor: grab;
        user-select: none;
      }
      .unit-panel.locked {
        cursor: default;
      }
      .unit-panel.dragging {
        cursor: grabbing;
        opacity: 0.92;
      }
      .panel-lock {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 20px;
        height: 20px;
        padding: 0;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: #e6e6e6;
        font-size: 11px;
        line-height: 20px;
        text-align: center;
        cursor: pointer;
      }
      .panel-lock:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      #player-panel {
        top: 48px;
      }
      #target-panel {
        top: 128px;
      }
      #target-panel[hidden] {
        display: none;
      }
      #character-panel {
        top: 208px;
      }
      #character-panel[hidden] {
        display: none;
      }
      .level-tag {
        font-weight: 400;
        color: #c9a63c;
      }
      .xp-bar .bar-fill {
        background: #c9a63c;
      }
      .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px 10px;
        margin-top: 6px;
        font-size: 11px;
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
      }
      .stat-row .stat-label {
        color: #a7b0c8;
      }
      .unit-name {
        font-weight: 600;
        margin-bottom: 4px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
      .bar {
        position: relative;
        height: 14px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.5);
        overflow: hidden;
        margin-top: 4px;
      }
      .bar-fill {
        height: 100%;
        width: 0%;
        background: #4fd166;
        transition: width 0.15s linear;
      }
      .cast-bar .bar-fill {
        background: #4ac0e8;
        transition: none;
      }
      .bar-label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      }
      .cast-bar[hidden] {
        display: none;
      }
      #inventory-panel {
        top: 288px;
      }
      #inventory-panel[hidden] {
        display: none;
      }
      .item-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 6px;
        max-height: 220px;
        overflow-y: auto;
      }
      .item-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 5px 8px;
        border: 1px solid #4a5578;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.3);
        font-size: 11px;
        cursor: pointer;
      }
      .item-row:hover {
        border-color: #c9a63c;
        background: rgba(40, 36, 20, 0.5);
      }
      .item-row .item-slot-tag {
        color: #a7b0c8;
        font-size: 10px;
      }
      .equipped-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 6px;
        margin-top: 3px;
        border: 1px solid #4a5578;
        border-radius: 6px;
        font-size: 11px;
        cursor: pointer;
      }
      .equipped-row.empty {
        color: #6b7390;
        cursor: default;
      }
      .equipped-row:not(.empty):hover {
        border-color: #c9a63c;
        background: rgba(40, 36, 20, 0.5);
      }
      #loot-window {
        left: auto;
        right: 12px;
        top: 48px;
        width: 240px;
      }
      #loot-window[hidden] {
        display: none;
      }
      .loot-actions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .loot-actions .overlay-button {
        flex: 1;
        padding: 6px;
        font-size: 11px;
      }
      #spell-panel {
        bottom: 90px;
        left: 50%;
        width: auto;
        transform: translateX(-50%);
      }
      #xp-panel {
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
      }
      #hotbar {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      .spell-slot {
        position: relative;
        width: 60px;
        height: 60px;
        border: 2px solid #4a5578;
        border-radius: 8px;
        background: rgba(20, 22, 32, 0.7);
        color: #e6e6e6;
        font: 12px/1.3 -apple-system, system-ui, sans-serif;
        overflow: hidden;
      }
      .spell-slot .key {
        position: absolute;
        top: 3px;
        left: 5px;
        font-weight: 600;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
      .spell-slot .name {
        position: absolute;
        bottom: 3px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 10px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
      .spell-slot .cooldown {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 0%;
        background: rgba(0, 0, 0, 0.65);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="auth-screen" class="overlay-screen">
      <h1 data-auth-title>Log in</h1>
      <form class="auth-form" data-auth-form>
        <input type="text" name="username" placeholder="Username" autocomplete="username" required />
        <input type="email" name="email" placeholder="Email" autocomplete="email" data-auth-email-field hidden />
        <input
          type="password"
          name="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        />
        <div class="overlay-error" data-auth-error></div>
        <button type="submit" class="overlay-button" data-auth-submit>Log In</button>
        <button type="button" class="overlay-link" data-auth-toggle>Need an account? Register</button>
      </form>
    </div>

    <div id="character-select-screen" class="overlay-screen" hidden>
      <h1>Select your character</h1>
      <div id="character-list"></div>
      <button type="button" class="overlay-button" data-create-character-btn>Create New Character</button>
      <button type="button" class="overlay-link" data-logout-btn>Log out</button>
    </div>

    <div id="character-create" class="overlay-screen" hidden>
      <h1>Create your character</h1>
      <input
        type="text"
        id="character-name-input"
        class="overlay-input"
        placeholder="Character name"
        maxlength="32"
        style="text-align: center; width: 260px"
      />
      <div id="class-select-options"></div>
      <div class="overlay-error" data-create-error></div>
      <button type="button" class="overlay-button" data-create-submit>Create Character</button>
      <button type="button" class="overlay-link" data-create-cancel>Back to character select</button>
    </div>

    <div id="hud">Connecting…</div>

    <div id="player-panel" class="unit-panel">
      <button class="panel-lock" data-lock aria-label="Lock panel">🔓</button>
      <div class="unit-name"><span data-player-class>You</span> <span class="level-tag" data-player-level></span></div>
      <div class="bar hp-bar">
        <div class="bar-fill" data-player-hp-fill></div>
        <span class="bar-label" data-player-hp-label></span>
      </div>
      <div class="bar cast-bar" data-player-cast-bar hidden>
        <div class="bar-fill" data-player-cast-fill></div>
        <span class="bar-label" data-player-cast-label></span>
      </div>
    </div>

    <div id="character-panel" class="unit-panel" hidden>
      <button class="panel-lock" data-lock aria-label="Lock panel">🔓</button>
      <div class="unit-name">Character</div>
      <div class="stat-row"><span class="stat-label">Class</span><span data-character-class></span></div>
      <div class="stat-grid">
        <div class="stat-row"><span class="stat-label">Strength</span><span data-stat-strength></span></div>
        <div class="stat-row"><span class="stat-label">Dexterity</span><span data-stat-dexterity></span></div>
        <div class="stat-row"><span class="stat-label">Intellect</span><span data-stat-intellect></span></div>
        <div class="stat-row"><span class="stat-label">Vitality</span><span data-stat-vitality></span></div>
        <div class="stat-row"><span class="stat-label">Luck</span><span data-stat-luck></span></div>
        <div class="stat-row"><span class="stat-label">Armor</span><span data-stat-armor></span></div>
      </div>
      <div class="unit-name" style="margin-top: 8px">Equipment</div>
      <div class="equipped-row empty" data-equip-row="weapon">
        <span class="stat-label">Weapon</span><span data-equip-name="weapon">Empty</span>
      </div>
      <div class="equipped-row empty" data-equip-row="armor">
        <span class="stat-label">Armor</span><span data-equip-name="armor">Empty</span>
      </div>
      <div class="equipped-row empty" data-equip-row="trinket">
        <span class="stat-label">Trinket</span><span data-equip-name="trinket">Empty</span>
      </div>
    </div>

    <div id="inventory-panel" class="unit-panel" hidden>
      <button class="panel-lock" data-lock aria-label="Lock panel">🔓</button>
      <div class="unit-name">Inventory</div>
      <div class="item-list" id="inventory-list"></div>
    </div>

    <div id="loot-window" class="unit-panel" hidden>
      <button class="panel-lock" data-lock aria-label="Lock panel">🔓</button>
      <div class="unit-name">Loot</div>
      <div class="item-list" id="loot-list"></div>
      <div class="loot-actions">
        <button type="button" class="overlay-button" data-loot-take-all>Take All</button>
        <button type="button" class="overlay-button" data-loot-close>Close</button>
      </div>
    </div>

    <div id="target-panel" class="unit-panel" hidden>
      <button class="panel-lock" data-lock aria-label="Lock panel">🔓</button>
      <div class="unit-name" data-target-name></div>
      <div class="bar hp-bar">
        <div class="bar-fill" data-target-hp-fill></div>
        <span class="bar-label" data-target-hp-label></span>
      </div>
      <div class="bar cast-bar" data-target-cast-bar hidden>
        <div class="bar-fill" data-target-cast-fill></div>
        <span class="bar-label">Casting…</span>
      </div>
    </div>

    <div id="spell-panel" class="unit-panel">
      <button class="panel-lock" data-lock aria-label="Lock panel">🔓</button>
      <div class="unit-name">Spells</div>
      <div id="hotbar">
        <div class="spell-slot" data-spell="1">
          <span class="key">1</span>
          <div class="cooldown" data-cooldown="1"></div>
          <span class="name" data-name="1"></span>
        </div>
        <div class="spell-slot" data-spell="2">
          <span class="key">2</span>
          <div class="cooldown" data-cooldown="2"></div>
          <span class="name" data-name="2"></span>
        </div>
        <div class="spell-slot" data-spell="3">
          <span class="key">3</span>
          <div class="cooldown" data-cooldown="3"></div>
          <span class="name" data-name="3"></span>
        </div>
      </div>
    </div>

    <div id="xp-panel" class="unit-panel">
      <button class="panel-lock" data-lock aria-label="Lock panel">🔓</button>
      <div class="unit-name">XP</div>
      <div class="bar xp-bar">
        <div class="bar-fill" data-xp-fill></div>
        <span class="bar-label" data-xp-label></span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
