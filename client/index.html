<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MMO 3D Navigateur</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #10121a;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        color: #e6e6e6;
        font: 13px/1.4 -apple-system, system-ui, sans-serif;
        background: rgba(0, 0, 0, 0.35);
        padding: 8px 12px;
        border-radius: 6px;
        pointer-events: none;
      }
      .unit-panel {
        position: fixed;
        left: 12px;
        width: 220px;
        color: #e6e6e6;
        font: 12px/1.3 -apple-system, system-ui, sans-serif;
        background: rgba(20, 22, 32, 0.7);
        border: 2px solid #4a5578;
        border-radius: 8px;
        padding: 8px 10px;
        cursor: grab;
        user-select: none;
      }
      .unit-panel.locked {
        cursor: default;
      }
      .unit-panel.dragging {
        cursor: grabbing;
        opacity: 0.92;
      }
      .panel-lock {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 20px;
        height: 20px;
        padding: 0;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: #e6e6e6;
        font-size: 11px;
        line-height: 20px;
        text-align: center;
        cursor: pointer;
      }
      .panel-lock:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      #player-panel {
        top: 48px;
      }
      #target-panel {
        top: 128px;
      }
      #target-panel[hidden] {
        display: none;
      }
      .unit-name {
        font-weight: 600;
        margin-bottom: 4px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
      .bar {
        position: relative;
        height: 14px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.5);
        overflow: hidden;
        margin-top: 4px;
      }
      .bar-fill {
        height: 100%;
        width: 0%;
        background: #4fd166;
        transition: width 0.15s linear;
      }
      .cast-bar .bar-fill {
        background: #4ac0e8;
        transition: none;
      }
      .bar-label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      }
      .cast-bar[hidden] {
        display: none;
      }
      #spell-panel {
        bottom: 20px;
        left: 50%;
        width: auto;
        transform: translateX(-50%);
      }
      #hotbar {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      .spell-slot {
        position: relative;
        width: 60px;
        height: 60px;
        border: 2px solid #4a5578;
        border-radius: 8px;
        background: rgba(20, 22, 32, 0.7);
        color: #e6e6e6;
        font: 12px/1.3 -apple-system, system-ui, sans-serif;
        overflow: hidden;
      }
      .spell-slot .key {
        position: absolute;
        top: 3px;
        left: 5px;
        font-weight: 600;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
      .spell-slot .name {
        position: absolute;
        bottom: 3px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 10px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
      .spell-slot .cooldown {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 0%;
        background: rgba(0, 0, 0, 0.65);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">Connecting…</div>

    <div id="player-panel" class="unit-panel">
      <button class="panel-lock" data-lock aria-label="Lock panel">🔓</button>
      <div class="unit-name">You</div>
      <div class="bar hp-bar">
        <div class="bar-fill" data-player-hp-fill></div>
        <span class="bar-label" data-player-hp-label></span>
      </div>
      <div class="bar cast-bar" data-player-cast-bar hidden>
        <div class="bar-fill" data-player-cast-fill></div>
        <span class="bar-label" data-player-cast-label></span>
      </div>
    </div>

    <div id="target-panel" class="unit-panel" hidden>
      <button class="panel-lock" data-lock aria-label="Lock panel">🔓</button>
      <div class="unit-name" data-target-name></div>
      <div class="bar hp-bar">
        <div class="bar-fill" data-target-hp-fill></div>
        <span class="bar-label" data-target-hp-label></span>
      </div>
      <div class="bar cast-bar" data-target-cast-bar hidden>
        <div class="bar-fill" data-target-cast-fill></div>
        <span class="bar-label">Casting…</span>
      </div>
    </div>

    <div id="spell-panel" class="unit-panel">
      <button class="panel-lock" data-lock aria-label="Lock panel">🔓</button>
      <div class="unit-name">Spells</div>
      <div id="hotbar">
        <div class="spell-slot" data-spell="1">
          <span class="key">1</span>
          <div class="cooldown" data-cooldown="1"></div>
          <span class="name" data-name="1"></span>
        </div>
        <div class="spell-slot" data-spell="2">
          <span class="key">2</span>
          <div class="cooldown" data-cooldown="2"></div>
          <span class="name" data-name="2"></span>
        </div>
        <div class="spell-slot" data-spell="3">
          <span class="key">3</span>
          <div class="cooldown" data-cooldown="3"></div>
          <span class="name" data-name="3"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
